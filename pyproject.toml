[project]
name = "topozarr"
version = "0.2.1"
description = "Lightweight multiscale zarr"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "psutil>=5.9",
    "pyproj",
    # exact pin: the Python layer and the Rust kernel ship as separate
    # distributions but are one unit; a range lets a resolver pair a new
    # topozarr with an old core that lacks the kernel arm it accepts.
    "topozarr-core==0.2.1",
    "xarray>=2025.9.0",
    "xproj>=0.2.1",
    "zarr>=3.2.1",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"


[project.optional-dependencies]
# Rust codec pipeline, used automatically for local stores when installed
zarrs = ["zarrs>=0.2.3"]
tutorial = [
    "boto3",
    "click",
    "cloudpathlib[s3]",
    "h5py",
    "h5netcdf",
    "icechunk>=1.1.19",
    "netcdf4",
    "obstore",
    "pooch",
    "virtualizarr",
    "zarr",
]

[dependency-groups]
test = [
    "zarrs>=0.2.3",
    "boto3>=1.0",
    "dask>=2026.7.1",
    "hypothesis>=6.150.0",
    "icechunk>=1.1.19",
    "jsonschema>=4.0",
    "moto[s3,server]>=5.0",
    "obstore>=0.9.1",
    "prek>=0.5.2",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.11",
    "tqdm>=4.66",
    "ty>=0.0.59",
]
conformance = [
    "geozarr-toolkit>=0.1.1,<0.2",
    {include-group = "test"},
]
docs = [
    "carbonplan-styles>=0.6",
    "dask>=2026.7.1",
    "icechunk>=2.0.6",
    "markdown-exec>=1.12.4",
    "matplotlib>=3.11.2",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.25",
    "netcdf4>=1.7.4",
    "pooch>=1.9.0",
    "rioxarray>=0.23.0",
    "virtualizarr[hdf]>=2.7.3",
    "xarray-regrid>=0.4.2",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
markers = [
    "conformance: validate against external spec tools (may be skipped with -m 'not conformance')",
]

[tool.uv.sources]
topozarr-core = { workspace = true }
# carbonplan/styles#92 (0.6) branch; switch to a PyPI pin once it merges and releases
carbonplan-styles = { git = "https://github.com/carbonplan/styles", branch = "modernize-uv" }

[tool.uv.workspace]
members = ["core"]
