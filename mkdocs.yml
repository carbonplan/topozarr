site_name: topozarr
site_description: Lightweight multiscale Zarr pyramids
site_url: https://carbonplan.github.io/topozarr/
repo_url: https://github.com/carbonplan/topozarr
repo_name: carbonplan/topozarr
copyright: "&copy; CarbonPlan"

theme:
  name: material
  font: false
  logo: assets/topozarr-lockup-on-dark.svg
  favicon: assets/topozarr-icon-dark-32.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 80
            docstring_section_style: list
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - Guide:
      - Usage: usage.md
      - Tuning: tuning.md
      - Tips and caveats: tips.md
  - Examples:
      - Categorical data: examples/categorical.md
      - Dask: examples/dask.md
      - Regridding: examples/regrid.md
      - Hybrid stores: examples/hybrid-icechunk.md
  - Concepts:
      - How it works: design.md
      - GeoZarr: geozarr.md
  - Reference:
      - API: api.md
      - Release notes: releases.md
      - Contributing: contributing.md
